x-common-env: &common-env
  NODE_ENV: production

services:
  # ==========================================
  # 1. APPS PRINCIPAIS (Sempre rodam)
  # ==========================================

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Use "3000:3000" para acesso local ou apenas "3000" se usar Proxy (Traefik)
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      BLOG_URL: ${BLOG_URL:-http://blog:4321}
      NEXT_PUBLIC_INFISICAL_URL: ${NEXT_PUBLIC_INFISICAL_URL:-https://app.infisical.com}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      POSTHOG_KEY: ${POSTHOG_KEY}
      POSTHOG_WEBSITE: ${POSTHOG_WEBSITE}
    depends_on:
      - blog
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  blog:
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
      args:
        INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
        INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
        INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
        INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
        POSTHOG_KEY: ${POSTHOG_KEY}
        POSTHOG_WEBSITE: ${POSTHOG_WEBSITE}
    ports:
      - "4321:4321"
    environment:
      <<: *common-env
      PUBLIC_INFISICAL_URL: ${PUBLIC_INFISICAL_URL:-https://app.infisical.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4321"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # 2. STACK INFISICAL (Profile: selfhosted)
  # ==========================================

  infisical:
    image: infisical/infisical:latest
    profiles: ["selfhosted"]
    ports:
      - "8080:8080"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-here}
      AUTH_SECRET: ${AUTH_SECRET:-your-auth-secret-here}
      SITE_URL: ${INFISICAL_SITE_URL:-http://127.0.0.1:8080}
      REDIS_URL: redis://redis:6379
      DB_CONNECTION_URI: postgresql://infisical:infisical@postgres:5432/infisical
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: ["selfhosted"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infisical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infisical}
      POSTGRES_DB: ${POSTGRES_DB:-infisical}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infisical}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. STACK POSTHOG (Profile: posthog)
  # ==========================================

  posthog:
    image: posthog/posthog:release-1.75.0
    profiles: ["posthog"]
    ports:
      - "8000:8000"
    environment:
      SITE_URL: ${POSTHOG_SITE_URL:-http://localhost:8000}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-supersecretkeyCHANGE_ME}
      # Conecta no DB dedicado do PostHog (service: posthog-db)
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      # Usa o DB 1 do Redis para não misturar com Infisical
      REDIS_URL: redis://redis:6379/1
      CLICKHOUSE_HOST: clickhouse
      SKIP_ASYNC_MIGRATIONS: "true"
    depends_on:
      - posthog-db
      - redis
      - clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/_health"]
      interval: 30s
      timeout: 10s
      retries: 5

  posthog-db:
    image: postgres:16-alpine
    profiles: ["posthog"]
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_DB: posthog
    volumes:
      - posthog_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    profiles: ["posthog"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. INFRAESTRUTURA COMPARTILHADA
  # ==========================================

  redis:
    image: redis:7-alpine
    # Ativa se QUALQUER um dos dois profiles for chamado
    profiles: ["selfhosted", "posthog"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Dados do Infisical
  postgres_data:
  # Dados do PostHog
  posthog_postgres_data:
  clickhouse_data:
  # Dados Compartilhados
  redis_data:
