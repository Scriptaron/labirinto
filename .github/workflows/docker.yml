name: Docker - Build & Push Images

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_WEB: ${{ github.repository }}/web
  IMAGE_NAME_BLOG: ${{ github.repository }}/blog

jobs:
  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/scriptaron/labirinto/web
          tags: |
            # Gera tags para branches (ex: main, develop)
            type=ref,event=branch
            # Gera tags para PRs (ex: pr-9)
            type=ref,event=pr
            # Gera tags semânticas se houver git tag (ex: 1.0.0, 1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # CORREÇÃO: Usa prefixo padrão 'sha-' (ex: sha-bd8845e)
            type=sha
            # Opcional: Tag 'latest' apenas na branch default
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-blog:
    name: Build Blog (Astro)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/scriptaron/labirinto/blog
          tags: |
            # Gera tags para branches (ex: main, develop)
            type=ref,event=branch
            # Gera tags para PRs (ex: pr-9)
            type=ref,event=pr
            # Gera tags semânticas se houver git tag (ex: 1.0.0, 1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # CORREÇÃO: Usa prefixo padrão 'sha-' (ex: sha-bd8845e)
            type=sha
            # Opcional: Tag 'latest' apenas na branch default
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/blog/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}
            INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}
            INFISICAL_PROJECT_ID=${{ secrets.INFISICAL_PROJECT_ID }}
            INFISICAL_ENVIRONMENT=prod

  test-compose:
    name: Test Docker Compose
    runs-on: ubuntu-24.04
    needs: [build-web, build-blog]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test docker compose (cloud profile)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          docker compose config
          docker compose up --wait
          # Testa Web
          docker compose exec -T web wget --spider -q http://127.0.0.1:3000 || exit 1
          # Testa Blog
          docker compose exec -T blog wget --spider -q http://127.0.0.1:4321 || exit 1
          # Testa Infisical se profile ativado
          if docker compose ps infisical | grep -q 'Up'; then
            docker compose exec -T infisical wget --spider -q http://127.0.0.1:8080/api/status || exit 1
          fi
          # Testa PostHog se profile ativado
          if docker compose ps posthog | grep -q 'Up'; then
            docker compose exec -T posthog wget --spider -q http://127.0.0.1:8021/health || exit 1
          fi
          docker compose down

      - name: Test docker compose (selfhosted profile)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          docker compose --profile selfhosted up --wait
          # Testa Web
          docker compose exec -T web wget --spider -q http://127.0.0.1:3000 || exit 1
          # Testa Blog
          docker compose exec -T blog wget --spider -q http://127.0.0.1:4321 || exit 1
          # Testa Infisical
          docker compose exec -T infisical wget --spider -q http://127.0.0.1:8080/api/status || exit 1
          # Testa PostHog se profile ativado
          if docker compose ps posthog | grep -q 'Up'; then
            docker compose exec -T posthog wget --spider -q http://127.0.0.1:8021/health || exit 1
          fi
          docker compose --profile selfhosted down
