name: CI - Tests & Coverage

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        include:
          - workspace: blog
            path: apps/blog
          - workspace: web
            path: apps/web
          - workspace: '@labirinto/i18n-config'
            path: packages/i18n-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: pnpm --filter "${{ matrix.workspace }}" test:coverage
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ matrix.path }}/coverage/coverage-final.json
          flags: ${{ matrix.workspace }}
          name: ${{ matrix.workspace }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm -r exec tsc --noEmit || true

      - name: Lint web
        run: pnpm --filter web lint || true
        continue-on-error: true
